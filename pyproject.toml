[project]
name = "car-fault-log"
version = "0.1.0"
description = "Лабораторна робота 1: журнал несправностей авто з перевіреною AI-функцією"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.120.0",
    "uvicorn>=0.38.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "openai>=2.34.0",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
